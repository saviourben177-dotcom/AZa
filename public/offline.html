<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aza — Offline</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #FFFFFF;
      --ink: #0A0C0B;
      --accent: #16A35E;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0A0C0B; --ink: #FFFFFF; }
    }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon { font-size: 32px; }
    h1 { margin-top: 16px; font-size: 19px; font-weight: 800; }
    p {
      margin-top: 8px;
      max-width: 320px;
      font-size: 13.5px;
      line-height: 1.5;
      opacity: 0.6;
    }
    button {
      margin-top: 24px;
      width: 100%;
      max-width: 280px;
      border-radius: 999px;
      background: var(--accent);
      padding: 14px;
      font-size: 14.5px;
      font-weight: 700;
      color: #FFFFFF;
      border: none;
    }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>You're offline</h1>
  <p>Can't reach Aza right now. Check your internet connection and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</body>
</html>
